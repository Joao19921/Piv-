name: Refresh pricing sources

on:
  schedule:
    # Aproximacao de "a cada 5 dias" (cron e baseado em calendario, nao em intervalo puro;
    # reinicia a contagem em cada virada de mes, entao o intervalo real varia entre 4 e 6 dias).
    - cron: "0 6 1,6,11,16,21,26 * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Rodar ingestao (Azure, AWS, GCP, PTAX -> Postgres)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PRICING_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PRICING_SECRET_ACCESS_KEY }}
          GOOGLE_CLOUD_BILLING_API_KEY: ${{ secrets.GOOGLE_CLOUD_BILLING_API_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL nao configurado ainda (Settings > Secrets and variables > Actions). Pulando ingestao."
            exit 0
          fi
          pnpm run refresh-sources
