name: CI

on:
  push:
    branches: [master]
  pull_request:

# Principio do menor privilegio: nenhum job abaixo escreve no repositorio.
permissions:
  contents: read

# Push novo na mesma branch cancela a execucao anterior (economiza minutos do runner e evita
# dois deploys concorrentes para a mesma branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Sem `version:` de proposito: a acao le o campo `packageManager` do package.json, que
      # fixa a versao exata + hash de integridade. Declarar nos dois lugares faz a acao abortar
      # com ERR_PNPM_BAD_PM_VERSION -- era o motivo de este pipeline nunca ter passado.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Versao vem do .nvmrc, nao repetida aqui: a versao do Node estava declarada em
          # quatro lugares (3x neste arquivo, 2x no Dockerfile e no --target do build:lambda),
          # e um bump que mexesse so num deles faria a gente testar num runtime e publicar noutro.
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build

  test:
    name: Testes automatizados
    runs-on: ubuntu-latest

    # A suite toca o Postgres de verdade (cria/apaga usuarios, grava historico de benchmark).
    # Este container e efemero e morre junto com o job -- nunca aponte DATABASE_URL daqui para
    # a Supabase, senao os testes apagam dados reais no teardown.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pivo
          POSTGRES_PASSWORD: pivo
          POSTGRES_DB: pivo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pivo -d pivo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pivo:pivo@localhost:5432/pivo_test
      # O container do Postgres sobe sem TLS; sem isso o driver tenta SSL e a conexao e recusada.
      DATABASE_SSL: disable
      # Valor fixo so para o cookie de sessao ter assinatura estavel dentro do job. Nao e segredo:
      # este banco e este processo existem por poucos minutos e nao sao alcancaveis de fora.
      SESSION_SECRET: ci-session-secret-efemero-do-runner
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      # Sem `version:` de proposito: a acao le o campo `packageManager` do package.json, que
      # fixa a versao exata + hash de integridade. Declarar nos dois lugares faz a acao abortar
      # com ERR_PNPM_BAD_PM_VERSION -- era o motivo de este pipeline nunca ter passado.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Versao vem do .nvmrc, nao repetida aqui: a versao do Node estava declarada em
          # quatro lugares (3x neste arquivo, 2x no Dockerfile e no --target do build:lambda),
          # e um bump que mexesse so num deles faria a gente testar num runtime e publicar noutro.
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Aplicar o schema no Postgres do job
        run: pnpm run migrate

      - name: Rodar a suite (vitest)
        run: pnpm test

  security:
    name: Segurança (dependências + segredos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Antes do pnpm install de proposito: com node_modules no disco, a varredura levaria
      # minutos e acusaria segredos de exemplo dentro de dependencias de terceiros.
      - name: Varredura de segredos (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --no-git --redact --verbose --exit-code 1 \
              --config=/repo/.gitleaks.toml

      # Sem `version:` de proposito: a acao le o campo `packageManager` do package.json, que
      # fixa a versao exata + hash de integridade. Declarar nos dois lugares faz a acao abortar
      # com ERR_PNPM_BAD_PM_VERSION -- era o motivo de este pipeline nunca ter passado.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Versao vem do .nvmrc, nao repetida aqui: a versao do Node estava declarada em
          # quatro lugares (3x neste arquivo, 2x no Dockerfile e no --target do build:lambda),
          # e um bump que mexesse so num deles faria a gente testar num runtime e publicar noutro.
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # GATE (quebra o build): qualquer vulnerabilidade high/critical NOVA numa dependencia que
      # vai para producao. O passivo conhecido na criacao deste gate esta listado, com o motivo
      # de cada item, em `pnpm.auditConfig.ignoreGhsas` no package.json -- essa lista deve
      # encolher, nunca crescer sem justificativa no PR.
      - name: Auditoria das dependências de produção
        run: pnpm audit --prod --audit-level high

      # Informativo (nao bloqueia): ferramentas de build/teste, que nao vao para o runtime.
      # Mantem visibilidade sem travar deploy por CVE de ferramenta que so roda nesta maquina.
      - name: Auditoria completa (informativo)
        run: pnpm audit --audit-level high || true

  deploy:
    name: Deploy (Render)
    needs: [build, test, security]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 traz o historico completo, necessario para o `merge-base --is-ancestor`
      # do smoke test abaixo.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Aplica o schema ANTES de publicar o codigo que depende dele.
      #
      # Sem esta etapa, migration em producao era passo manual -- e isso mordeu de verdade: as
      # migrations 0007, 0008 e 0009 ficaram pendentes na Supabase com o codigo ja no ar. Nao
      # quebrou visivelmente porque os caminhos afetados sao defensivos (void ... .catch,
      # fire-and-forget, fallback para cache), entao o app degradou EM SILENCIO: bloqueio de
      # conta sem contador duravel, auditoria sem gravar nada, historico voltando vazio.
      #
      # Rodar aqui e seguro por construcao: este job so existe se `test` passou, e o job de teste
      # aplica exatamente estas migrations num Postgres virgem e roda a suite inteira em cima
      # delas. Producao nunca ve migration que nao provou aplicar limpo.
      #
      # Falha aqui ABORTA o deploy de proposito: publicar codigo que espera um schema que nao
      # subiu e precisamente o problema que esta etapa existe para evitar.
      #
      # CONTRATO: migration tem que ser compativel com a versao ANTERIOR do codigo, porque ela
      # roda enquanto a versao antiga ainda esta servindo (o build do Render leva minutos).
      # Na pratica: `add column` sim, `drop column`/`rename` so em duas etapas (expand/contract).
      - name: Aplicar migrations pendentes em produção
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Secret DATABASE_URL nao configurado; migrations NAO foram aplicadas."
            echo "O deploy segue, mas o schema pode ficar defasado em relacao ao codigo."
            exit 0
          fi
          pnpm run migrate

      - name: Disparar deploy hook do Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL nao configurado ainda (Settings > Secrets and variables > Actions). Pulando deploy."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      # Espera a versao DESTE push estar no ar, e nao so "o servico esta de pe".
      #
      # O deploy hook do Render responde na hora, muito antes do build terminar. A primeira
      # versao deste passo so checava HTTP 200 e passava em 3 segundos -- acertando a instancia
      # ANTIGA, que obviamente estava saudavel. Comparar o commit publicado em /healthz
      # (RENDER_GIT_COMMIT, injetada pelo Render) com github.sha e o que torna o smoke test uma
      # verificacao de verdade.
      - name: Smoke test pós-deploy (versão publicada)
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "Variavel PRODUCTION_URL nao definida (Settings > Secrets and variables > Actions > Variables)."
            echo "Sem ela nao da pra validar o deploy automaticamente. Pulando."
            exit 0
          fi

          # Publicar nao e o mesmo que funcionar. A versao pode subir com o app inutilizavel: foi
          # o que aconteceu quando a aplicacao perdeu acesso ao Postgres -- toda rota que
          # consultava respondia 500 enquanto /healthz devolvia 200, porque ele nao tocava o
          # banco. O deploy passou verde e ninguem soube ate um usuario relatar que o login parou.
          verificar_banco() {
            estado=$(printf '%s' "$1" | sed -n 's/.*"db"[^{]*{[^}]*"status"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')

            case "$estado" in
              ok)
                echo "OK: o banco responde."
                return 0
                ;;
              not_configured)
                echo "::warning::A instancia no ar esta sem DATABASE_URL. Rotas que consultam vao falhar."
                return 0
                ;;
              unreachable)
                echo "::error::A versao subiu, mas a aplicacao NAO consegue falar com o banco."
                echo "Toda rota que consulta o Postgres responde 500 -- login inclusive."
                echo "Verifique DATABASE_URL, DATABASE_SSL e DATABASE_CA_CERT no painel do Render."
                return 1
                ;;
              *)
                echo "::warning::A instancia no ar e anterior ao campo 'db' em /healthz; sem como verificar o banco."
                return 0
                ;;
            esac
          }

          echo "Aguardando $PRODUCTION_URL publicar o commit $EXPECTED_COMMIT (ate 12 min)..."
          for attempt in $(seq 1 72); do
            body=$(curl -s --max-time 20 "$PRODUCTION_URL/api/v1/healthz" || echo "")
            deployed=$(printf '%s' "$body" | sed -n 's/.*"commit"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')

            if [ "$deployed" = "$EXPECTED_COMMIT" ]; then
              echo "OK: o commit $EXPECTED_COMMIT esta no ar (tentativa $attempt)."
              verificar_banco "$body"
              exit $?
            fi

            # Aceita tambem um commit MAIS NOVO que ja contenha o nosso. Sem isso, dois pushes
            # em sequencia se atropelam: o Render publica o mais recente, a comparacao exata por
            # SHA nunca bate, e o job estoura o timeout mesmo com o deploy perfeitamente saudavel
            # -- o que treinaria o time a ignorar um smoke test vermelho.
            if [ -n "$deployed" ] && git cat-file -e "${deployed}^{commit}" 2>/dev/null \
               && git merge-base --is-ancestor "$EXPECTED_COMMIT" "$deployed"; then
              echo "OK: no ar esta o commit $deployed, mais novo e que ja contem $EXPECTED_COMMIT."
              verificar_banco "$body"
              exit $?
            fi

            # "unknown" = versao antiga, publicada antes de /healthz passar a expor o commit.
            # Nesse caso nao da para comparar; aceita 200 como suficiente so nesta transicao.
            if [ "$deployed" = "unknown" ]; then
              echo "AVISO: a instancia no ar e anterior a este campo em /healthz; aceitando 200 desta vez."
              exit 0
            fi

            echo "  tentativa $attempt: commit publicado = '${deployed:-sem resposta}'"
            sleep 10
          done

          echo "FALHOU: $PRODUCTION_URL nao publicou o commit $EXPECTED_COMMIT em 12 minutos."
          echo "Verifique o build no painel do Render."
          exit 1
