name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Principio do menor privilegio: nenhum job abaixo escreve no repositorio.
permissions:
  contents: read

# Push novo na mesma branch cancela a execucao anterior (economiza minutos do runner e evita
# dois deploys concorrentes para a mesma branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Sem `version:` de proposito: a acao le o campo `packageManager` do package.json, que
      # fixa a versao exata + hash de integridade. Declarar nos dois lugares faz a acao abortar
      # com ERR_PNPM_BAD_PM_VERSION -- era o motivo de este pipeline nunca ter passado.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build

  test:
    name: Testes automatizados
    runs-on: ubuntu-latest

    # A suite toca o Postgres de verdade (cria/apaga usuarios, grava historico de benchmark).
    # Este container e efemero e morre junto com o job -- nunca aponte DATABASE_URL daqui para
    # a Supabase, senao os testes apagam dados reais no teardown.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pivo
          POSTGRES_PASSWORD: pivo
          POSTGRES_DB: pivo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pivo -d pivo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pivo:pivo@localhost:5432/pivo_test
      # O container do Postgres sobe sem TLS; sem isso o driver tenta SSL e a conexao e recusada.
      DATABASE_SSL: disable
      # Valor fixo so para o cookie de sessao ter assinatura estavel dentro do job. Nao e segredo:
      # este banco e este processo existem por poucos minutos e nao sao alcancaveis de fora.
      SESSION_SECRET: ci-session-secret-efemero-do-runner
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      # Sem `version:` de proposito: a acao le o campo `packageManager` do package.json, que
      # fixa a versao exata + hash de integridade. Declarar nos dois lugares faz a acao abortar
      # com ERR_PNPM_BAD_PM_VERSION -- era o motivo de este pipeline nunca ter passado.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Aplicar o schema no Postgres do job
        run: pnpm run migrate

      - name: Rodar a suite (vitest)
        run: pnpm test

  security:
    name: Segurança (dependências + segredos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Antes do pnpm install de proposito: com node_modules no disco, a varredura levaria
      # minutos e acusaria segredos de exemplo dentro de dependencias de terceiros.
      - name: Varredura de segredos (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --no-git --redact --verbose --exit-code 1 \
              --config=/repo/.gitleaks.toml

      # Sem `version:` de proposito: a acao le o campo `packageManager` do package.json, que
      # fixa a versao exata + hash de integridade. Declarar nos dois lugares faz a acao abortar
      # com ERR_PNPM_BAD_PM_VERSION -- era o motivo de este pipeline nunca ter passado.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # GATE (quebra o build): qualquer vulnerabilidade high/critical NOVA numa dependencia que
      # vai para producao. O passivo conhecido na criacao deste gate esta listado, com o motivo
      # de cada item, em `pnpm.auditConfig.ignoreGhsas` no package.json -- essa lista deve
      # encolher, nunca crescer sem justificativa no PR.
      - name: Auditoria das dependências de produção
        run: pnpm audit --prod --audit-level high

      # Informativo (nao bloqueia): ferramentas de build/teste, que nao vao para o runtime.
      # Mantem visibilidade sem travar deploy por CVE de ferramenta que so roda nesta maquina.
      - name: Auditoria completa (informativo)
        run: pnpm audit --audit-level high || true

  deploy:
    name: Deploy (Render)
    needs: [build, test, security]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy hook do Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL nao configurado ainda (Settings > Secrets and variables > Actions). Pulando deploy."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      # O deploy hook responde na hora, antes do build do Render terminar -- sem esta etapa
      # ninguem descobre um deploy que subiu quebrado a nao ser abrindo o app na mao.
      - name: Smoke test pós-deploy (/healthz)
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "Variavel PRODUCTION_URL nao definida (Settings > Secrets and variables > Actions > Variables)."
            echo "Sem ela nao da pra validar o deploy automaticamente. Pulando."
            exit 0
          fi
          echo "Aguardando $PRODUCTION_URL/api/v1/healthz responder 200 (ate 10 min)..."
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$PRODUCTION_URL/api/v1/healthz" || echo "000")
            if [ "$code" = "200" ]; then
              echo "OK: /healthz respondeu 200 na tentativa $attempt."
              exit 0
            fi
            echo "  tentativa $attempt: HTTP $code"
            sleep 10
          done
          echo "FALHOU: /healthz nao respondeu 200 em 10 minutos apos o deploy."
          exit 1
