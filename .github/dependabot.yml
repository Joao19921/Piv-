# Atualizacao automatica de dependencias. Antes disso nada avisava sobre uma CVE nova: a
# unica varredura era manual, e o audit do CI so quebra o build depois que a vulnerabilidade
# ja esta no lockfile -- o Dependabot e quem abre o PR com a correcao.
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Ferramentas de build/teste sobem juntas num PR so: sao muitas, mudam com frequencia e
      # nao vao para o runtime -- um PR por pacote afogaria os PRs que importam.
      dev-tooling:
        dependency-type: development
      # UI da Radix: dezenas de pacotes versionados em conjunto, sempre atualizados juntos.
      radix-ui:
        patterns:
          - "@radix-ui/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # Major do Node nao pode entrar por PR automatico. A versao vive em tres lugares que
      # precisam andar juntos (.nvmrc, ARG NODE_VERSION no Dockerfile e --target=nodeXX em
      # build:lambda): um PR que mexe so no Dockerfile faz a gente testar num runtime e publicar
      # noutro. Alem disso, o major mais novo costuma ser "Current", nao LTS -- producao nao e
      # lugar de rodar release que ainda vai virar LTS. Bump de major aqui e trabalho manual e
      # deliberado; minor/patch continuam automaticos.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
