services:
  - type: web
    name: pivo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: Homologação
      - key: SESSION_SECRET
        sync: false
      - key: MARKET_BENCHMARK_CONNECTOR_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
